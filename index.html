/* ================= APIヘルパー ================= */
async function callClaude(prompt) {
  let lastErr = null;
  // 混雑などの一時的な失敗に備え、少し間を置いて最大3回まで自動再試行する
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          messages: [{ role: "user", content: prompt }],
        }),
      });
      // res.json() はSafariで不可解なエラー文を出すため、テキストで受けて自前で解析する
      const raw = await res.text();
      let data = null;
      try { data = JSON.parse(raw); } catch (e) {
        throw new Error(`サーバー応答が不正でした(混雑の可能性・状態${res.status})`);
      }
      if (data.error) throw new Error(data.error.message || "APIエラー");
      const text = (data.content || [])
        .filter((b) => b.type === "text")
        .map((b) => b.text)
        .join("\n");
      if (!text) throw new Error("空の応答");
      return text;
    } catch (e) {
      lastErr = e;
      if (attempt < 2) await new Promise((r) => setTimeout(r, 900 * (attempt + 1)));
    }
  }
  throw lastErr || new Error("接続に失敗しました");
}

function parseJSON(text) {
  const clean = text.replace(/```json|```/g, "").trim();
  const starts = [clean.indexOf("{"), clean.indexOf("[")].filter((i) => i >= 0);
  if (starts.length === 0) throw new Error("JSONが見つかりません");
  const start = Math.min(...starts);
  const end = Math.max(clean.lastIndexOf("}"), clean.lastIndexOf("]"));
  return JSON.parse(clean.slice(start, end + 1));
}

/* AI会話の返答を頑丈に取り出す。
   正規のJSONで解析→ダメなら括弧範囲で再試行→それでもダメなら
   "reply" などのフィールドを個別救出→最後は全文を返答として扱う。
   これによりAIの形式ブレや途中切れでも会話が止まらない。 */
function parseTalk(text) {
  const clean = (text || "").replace(/```json|```/g, "").trim();
  const normalize = (o) => {
    if (!o || typeof o.reply !== "string" || !o.reply.trim()) return null;
    const nul = (v) => (typeof v === "string" && v.trim() && v.trim().toLowerCase() !== "null" ? v : null);
    return { reply: o.reply, jp: nul(o.reply_jp), feedback: nul(o.feedback), better: nul(o.better) };
  };
  try { const r = normalize(parseJSON(clean)); if (r) return r; } catch (e) { /* 次の手段へ */ }
  // フィールド単位の救出(途中で切れたJSONにも対応)
  const grab = (key) => {
    const m = clean.match(new RegExp('"' + key + '"\\s*:\\s*"((?:[^"\\\\]|\\\\.)*)'));
    if (!m) return null;
    return m[1].replace(/\\n/g, "\n").replace(/\\"/g, '"').replace(/\\\\/g, "\\");
  };
  const reply = grab("reply");
  if (reply && reply.trim()) {
    return normalize({ reply, reply_jp: grab("reply_jp"), feedback: grab("feedback"), better: grab("better") });
  }
  // JSONの気配が全く無い=素の英文で返してきた場合は、全文を返答として扱う
  if (clean && clean.indexOf('"reply"') < 0 && !clean.startsWith("{")) {
    return { reply: clean, feedback: null, better: null };
  }
  throw new Error("返答の形式を解析できませんでした");
}

/* クイズ配列を頑丈に取り出す:
   - 配列そのまま / {"questions":[...]} などの包み / 途中で切れたJSON にも対応 */
function extractQuizArray(text) {
  let j = null;
  try { j = parseJSON(text); } catch (e) { /* 下で復元を試す */ }
  if (!Array.isArray(j) && j && typeof j === "object") {
    const key = Object.keys(j).find((k) => Array.isArray(j[k]));
    if (key) j = j[key];
  }
  if (!Array.isArray(j)) {
    // 途中で切れた配列の復元: 最後に完結した "}" までで閉じる
    const clean = text.replace(/```json|```/g, "").trim();
    const start = clean.indexOf("[");
    const lastObj = clean.lastIndexOf("}");
    if (start >= 0 && lastObj > start) {
      try { j = JSON.parse(clean.slice(start, lastObj + 1) + "]"); } catch (e) { /* 失敗 */ }
    }
  }
  if (!Array.isArray(j)) throw new Error("応答の形式を解析できませんでした");
  const valid = j.filter(
    (q) => q && typeof q.question === "string" && Array.isArray(q.choices) &&
      q.choices.length >= 2 && Number.isInteger(q.answer) &&
      q.answer >= 0 && q.answer < q.choices.length
  );
  if (valid.length === 0) throw new Error("有効な問題がありませんでした");
  return valid;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* 問題文から不変のIDを生成。記録をこのIDで保存することで、
   アプリを更新して問題を追加・並べ替えても学習記録が引き継がれる。 */
function qid(q) {
  const s = q.q || q.question || q.partner || JSON.stringify(q);
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
  return "q" + h.toString(36);
}

/* 選択肢の並びをランダム化し、正解インデックスを追従させる。
   {c, a} 形式(前置詞・冠詞)と {choices, answer} 形式(スラング・会話)の両対応。
   正解の位置が偏って予測できてしまう問題を、出題のたびに構造的に防ぐ。 */
function shuffleChoices(q) {
  const isCA = Array.isArray(q.c);
  const choices = isCA ? q.c : q.choices;
  const ansIdx = isCA ? q.a : q.answer;
  const idxs = shuffle(choices.map((_, i) => i));
  const newChoices = idxs.map((i) => choices[i]);
  const newAns = idxs.indexOf(ansIdx);
  return isCA ? { ...q, c: newChoices, a: newAns } : { ...q, choices: newChoices, answer: newAns };
}

/* 穴埋め問題の正解を埋めた読み上げ用の文を組み立てる。
   「(無冠詞)」「(何も入れない)」のような日本語注釈の選択肢は空欄として扱う。 */
function fillSentence(q) {
  const ans = /[(（]/.test(q.c[q.a]) ? "" : q.c[q.a];
  return q.q.split("___").join(" " + ans + " ").replace(/\s+/g, " ").trim();
}

/* ================= 英語読み上げ(音声) ================= */

  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);

    u.rate = 0.92; // 学習者向けに少しゆっくり
    const en = window.speechSynthesis.getVoices().find((v) => v.lang && v.lang.startsWith("en"));
    if (en) u.voice = en;
    window.speechSynthesis.speak(u);
  } catch (e) { /* 音声非対応環境では無音のまま継続 */ }
}

/* ================= 忘却曲線ローテーション =================
   未出題 → 初正解で3日後に「一度だけ」復習 → 復習でも正解したら卒業(二度と出ない)。
   不正解 → 正解するまで再出題。復習期限が来ていない問題は決して出さない。 */
const DAY = 86400000;
const REVIEW_INTERVAL = 3 * DAY;

/* ================= 多層ストレージ =================
   環境によって使える保存機能が異なるため、起動時に
   ①標準ストレージ ②ブラウザ保存 ③内蔵DB(IndexedDB) を順にテストし、
   実際に読み書きできた方式を採用する。全滅時のみメモリ(起動中のみ有効)。 */
const memStore = new Map();
const storageBackend = { type: null };
let _initPromise = null;

function idbOpen() {
  return new Promise((res, rej) => {
    const req = indexedDB.open("akapen-db", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("kv");
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
async function idbSet(k, v) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction("kv", "readwrite");
    tx.objectStore("kv").put(v, k);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}
async function idbGet(k) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction("kv", "readonly");
    const rq = tx.objectStore("kv").get(k);
    rq.onsuccess = () => res(rq.result === undefined ? null : rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
async function idbDel(k) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction("kv", "readwrite");
    tx.objectStore("kv").delete(k);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}

async function initStorage() {
  const stamp = "t" + Date.now();
  // ① 標準ストレージ(claude.ai)
  try {
    await window.storage.set("selftest", stamp);
    const r = await window.storage.get("selftest");
    if (r && r.value === stamp) { storageBackend.type = "claude"; return "claude"; }
  } catch (e) { /* 次へ */ }
  // ② ブラウザ保存(localStorage)
  try {
    window.localStorage.setItem("akapen:selftest", stamp);
    if (window.localStorage.getItem("akapen:selftest") === stamp) { storageBackend.type = "local"; return "local"; }
  } catch (e) { /* 次へ */ }
  // ③ 内蔵データベース(IndexedDB)
  try {
    await idbSet("selftest", stamp);
    if ((await idbGet("selftest")) === stamp) { storageBackend.type = "idb"; return "idb"; }
  } catch (e) { /* 次へ */ }
  storageBackend.type = "memory";
  return "memory";
}
function ensureStorage() {
  if (!_initPromise) _initPromise = initStorage();
  return _initPromise;
}
async function kvSet(key, value) {
  await ensureStorage();
  try {
    if (storageBackend.type === "claude") { await window.storage.set(key, value); return; }
    if (storageBackend.type === "local") { window.localStorage.setItem("akapen:" + key, value); return; }
    if (storageBackend.type === "idb") { await idbSet(key, value); return; }
  } catch (e) { /* 最後の砦へ */ }
  memStore.set(key, value);
}
async function kvGet(key) {
  await ensureStorage();
  try {
    if (storageBackend.type === "claude") { const r = await window.storage.get(key); return r ? r.value : null; }
    if (storageBackend.type === "local") { return window.localStorage.getItem("akapen:" + key); }
    if (storageBackend.type === "idb") { return await idbGet(key); }
  } catch (e) { /* 最後の砦へ */ }
  return memStore.has(key) ? memStore.get(key) : null;
}
async function kvDel(key) {
  await ensureStorage();
  try {
    if (storageBackend.type === "claude") { await window.storage.delete(key); return; }
    if (storageBackend.type === "local") { window.localStorage.removeItem("akapen:" + key); return; }
    if (storageBackend.type === "idb") { await idbDel(key); return; }
  } catch (e) { /* 最後の砦へ */ }
  memStore.delete(key);
}

async function loadSRS(key) {
  try {
    const v = await kvGet(`srs:${key}`);
    if (v) return JSON.parse(v);
  } catch (e) { /* 壊れていたら空から */ }
  return {};
}
async function saveSRS(key, state) {
  try { await kvSet(`srs:${key}`, JSON.stringify(state)); } catch (e) { /* 保存不可でも継続 */ }
}
async function clearSRS(key) {
  try { await kvDel(`srs:${key}`); } catch (e) { /* 無ければそれでよし */ }
}
/* 解答を記録。stage: 0=学習中 / 1=復習待ち(あと1回だけ出る) / 2=卒業(永久に出ない) */
function gradeSRS(state, id, correct) {
  const rec = state[id] || { stage: 0, due: 0 };
  if (correct) {
    if (rec.stage === 1) { rec.stage = 2; rec.due = 0; }               // 復習で正解 → 卒業
    else if (rec.stage === 0) { rec.stage = 1; rec.due = Date.now() + REVIEW_INTERVAL; } // 初正解 → 3日後に一度だけ
  } else {
    rec.stage = 0;
    rec.due = Date.now(); // 間違い → 正解するまで再挑戦
  }
  state[id] = rec;
  return state;
}
/* 出題選定: ①期限が来た復習・誤答の再挑戦 → ②未出題の新問。
   期限前・卒業済みは決して出さない。足りなければセットは短くなる。 */
function pickSRS(ids, state, n) {
  const now = Date.now();
  const active = ids.filter((i) => !(state[i] && state[i].stage === 2)); // 卒業組は永久除外
  const due = active.filter((i) => state[i] && state[i].due <= now);
  const fresh = shuffle(active.filter((i) => !state[i]));
  due.sort((a, b) => state[a].due - state[b].due);
  const picked = [...due, ...fresh].slice(0, n);
  const waiting = ids.filter((i) => state[i] && state[i].stage === 1 && state[i].due > now);
  return {
    picked: shuffle(picked),
    reviewCount: picked.filter((i) => state[i]).length,
    freshCount: picked.filter((i) => !state[i]).length,
    nextDue: waiting.length ? Math.min(...waiting.map((i) => state[i].due)) : null,
    graduated: ids.filter((i) => state[i] && state[i].stage === 2).length,
  };
}

/* ================= 汎用クイズ ================= */
function Quiz({ bank, bankId, title, onBack }) {
  const [srs, setSrs] = useState(null);
  const [order, setOrder] = useState(null);
  const [roundQs, setRoundQs] = useState(null);
  const [info, setInfo] = useState({ reviewCount: 0, freshCount: 0 });
  const [idx, setIdx] = useState(0);
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(false);
  const [misses, setMisses] = useState([]); // この回で間違えた問題(復習リスト用)
  const [resumed, setResumed] = useState(false); // 前回の続きから再開したか

  const setup = (state) => {
    kvDel(`sess:${bankId}`); // 新しいセットを組むので途中経過は破棄
    setResumed(false);
    const keys = bank.map(qid);
    const ids = bank.map((_, i) => i);
    // 添字ではなく不変ID(問題文ハッシュ)で記録を照合する
    const idxState = {};
    ids.forEach((i) => { if (state[keys[i]]) idxState[i] = state[keys[i]]; });
    const r = pickSRS(ids, idxState, 10);
    setInfo(r);
    setOrder(r.picked);
    setRoundQs(r.picked.map((i) => shuffleChoices(bank[i]))); // 選択肢の並びも毎回ランダム化
    setIdx(0); setPicked(null); setScore(0); setDone(false); setMisses([]);
  };

  useEffect(() => {
    (async () => {
      const s = await loadSRS(bankId);
      setSrs(s);
      // 途中で閉じたセットが残っていれば、そこから再開する
      try {
        const raw = await kvGet(`sess:${bankId}`);
        if (raw) {
          const sess = JSON.parse(raw);
          const valid = sess && Array.isArray(sess.order) && sess.order.length > 0 &&
            sess.idx > 0 && sess.idx < sess.order.length &&
            sess.order.every((i) => i >= 0 && i < bank.length);
          if (valid) {
            setInfo({ reviewCount: 0, freshCount: 0 });
            setOrder(sess.order);
            setRoundQs(sess.order.map((i) => shuffleChoices(bank[i])));
            setIdx(sess.idx);
            setScore(sess.score || 0);
            setMisses((sess.misses || []).map((m) => ({ q: bank[m.bi], chosen: m.chosen, bi: m.bi })));
            setPicked(null); setDone(false);
            setResumed(true);
            return;
          }
        }
      } catch (e) { /* 壊れた途中経過は無視して新規セットへ */ }
      setup(s);
    })();
  }, []);

  const restart = () => setup(srs);
  const resetAll = async () => {
    await clearSRS(bankId);
    const s = {};
    setSrs(s);
    setup(s);
  };

  if (!order || !roundQs) {
    return <div style={sx.card}><p style={{ color: C.sub, fontSize: 14 }}>問題を準備中…</p></div>;
  }

  // 在庫切れ: 新問を消化し尽くし、復習期限もまだ来ていない状態
  if (order.length === 0) {
    return (
      <div style={sx.card}>
        <p style={sx.eyebrow}>{title}</p>
        <p style={{ fontSize: 14, lineHeight: 1.8, margin: "10px 0", color: C.ink }}>
          今出せる問題がありません。おめでとうございます — 未出題の問題をすべて消化しました(卒業済み: {info.graduated}問)。
        </p>
        {info.nextDue && (
          <p style={{ fontSize: 13, color: C.sub }}>
            次の復習日: {new Date(info.nextDue).toLocaleDateString("ja-JP", { month: "long", day: "numeric" })}
          </p>
        )}
        <p style={{ fontSize: 13, color: C.sub, lineHeight: 1.7 }}>
          チャットで「前置詞(または冠詞・スラング)を補充して」と頼めば、新しい問題を追加できます。
        </p>
        <button style={sx.btnGhost} onClick={resetAll}>学習記録をリセットして全問やり直す</button>
        <button style={sx.btnGhost} onClick={onBack}>ホームに戻る</button>
      </div>
    );
  }

  const total = order.length;
  const q = roundQs[idx];

  const resumeBanner = resumed && !done ? (
    <p style={{ fontSize: 12.5, color: "#3D6B44", background: "#E4EFE0", borderRadius: 8, padding: "7px 12px", margin: "0 0 10px" }}>
      ↩ 前回の続き(第{idx + 1}問)から再開しました。解答は1問ごとに保存されています。
    </p>
  ) : null;

  const pick = (i) => {
    if (picked !== null) return;
    setPicked(i);
    const correct = i === q.a;
    const newScore = score + (correct ? 1 : 0);
    const newMisses = correct ? misses : [...misses, { q, chosen: q.c[i], bi: order[idx] }];
    if (correct) setScore(newScore);
    else setMisses(newMisses);
    // 解答した瞬間に忘却曲線へ記録(不変IDで保存 → 更新後も引き継がれる)
    const s = gradeSRS({ ...srs }, qid(bank[order[idx]]), correct);
    setSrs(s);
    saveSRS(bankId, s);
    // 途中経過も保存: スクロール等でアプリが閉じても次回同じ場所から再開できる
    if (idx + 1 < total) {
      kvSet(`sess:${bankId}`, JSON.stringify({
        order, idx: idx + 1, score: newScore,
        misses: newMisses.map((m) => ({ bi: m.bi !== undefined ? m.bi : order[idx], chosen: m.chosen })),
      }));
    } else {
      kvDel(`sess:${bankId}`);
    }
  };
  const next = () => {
    if (idx + 1 >= total) setDone(true);
    else { setIdx(idx + 1); setPicked(null); }
  };

  if (done) {
    return (
      <div style={sx.card}>
        <p style={sx.eyebrow}>{title} — 結果</p>
        <p style={{ fontFamily: "'Zilla Slab', serif", fontSize: 44, fontWeight: 700, margin: "8px 0", color: C.ink }}>
          {score} <span style={{ fontSize: 20, color: C.sub }}>/ {total}</span>
        </p>
        <p style={{ color: C.sub, fontSize: 14 }}>
          {score === total ? "満点!赤ペンの出番なしです。" : score >= total * 0.7 ? "好調です。下の復習リストを読み返しましょう。" : "間違えた問題こそ財産。下の復習リストをどうぞ。"}
        </p>
        {misses.length > 0 && (
          <div style={{ margin: "14px 0 4px" }}>
            <p style={{ margin: 0, fontSize: 12, fontWeight: 700, color: C.red, letterSpacing: 1 }}>赤ペン復習リスト({misses.length}問)</p>
            {misses.map((m, i) => (
              <div key={i} style={{ ...sx.redNote, marginTop: 10 }}>
                <p style={{ margin: 0, fontFamily: "'Zilla Slab', serif", fontSize: 15, lineHeight: 1.6, color: C.ink }}>
                  {m.q.q.split("___").map((part, j, arr) => (
                    <React.Fragment key={j}>
                      {part}
                      {j < arr.length - 1 && <span style={{ background: C.hi, padding: "0 8px", borderRadius: 3 }}>{m.q.c[m.q.a]}</span>}
                    </React.Fragment>
                  ))}
                </p>
                <p style={{ margin: "6px 0 0", fontSize: 12.5, color: C.red }}>
                  あなたの答え: {m.chosen} → 正解: {m.q.c[m.q.a]}
                </p>
                <p style={{ margin: "6px 0 0", fontSize: 13, lineHeight: 1.7, color: C.ink }}>{m.q.e}</p>
              </div>
            ))}
            <p style={{ margin: "10px 0 0", fontSize: 12, color: C.sub }}>この{misses.length}問は「次のセットへ」で最優先で再出題されます。正解するまで何度でも出ます。</p>
          </div>
        )}
        <p style={{ color: C.sub, fontSize: 12, lineHeight: 1.7 }}>
          正解した問題は3日後に一度だけ復習に現れ、そこでも正解すると卒業して二度と出ません。間違えた問題は正解できるまで繰り返し出ます。
        </p>
        <button style={sx.btnPrimary} onClick={restart}>次のセットへ</button>
        <button style={sx.btnGhost} onClick={onBack}>ホームに戻る</button>
      </div>
    );
  }

  return (
    <div style={sx.card}>
      {resumeBanner}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <p style={sx.eyebrow}>{title}
          {info.freshCount > 0 && <span style={{ fontWeight: 400, fontSize: 11, color: C.red, marginLeft: 6 }}>新出{info.freshCount}</span>}
          {info.reviewCount > 0 && <span style={{ fontWeight: 400, fontSize: 11, color: C.sub, marginLeft: 6 }}>復習{info.reviewCount}</span>}
        </p>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <p style={{ fontSize: 13, color: C.sub, margin: 0 }}>第 {idx + 1} 問 / {total}</p>
          <button onClick={() => setup(srs)} aria-label="セットを引き直す"
            style={{ background: "none", border: `1px solid ${C.line}`, borderRadius: 8, cursor: "pointer", fontSize: 13, padding: "2px 8px", color: C.ink }}>
            🔀
          </button>
        </div>
      </div>
      <div style={{ height: 4, background: C.line, borderRadius: 2, margin: "8px 0 18px" }}>
        <div style={{ height: 4, width: `${((idx + (picked !== null ? 1 : 0)) / total) * 100}%`, background: C.ink, borderRadius: 2, transition: "width 0.3s" }} />
      </div>
      <p style={{ fontFamily: "'Zilla Slab', serif", fontSize: 21, fontWeight: 500, lineHeight: 1.5, color: C.ink, margin: "0 0 18px" }}>
        {q.q.split("___").map((part, i, arr) => (
          <React.Fragment key={i}>
            {part}
            {i < arr.length - 1 && (
              <span style={{ background: C.hi, padding: "0 14px", borderRadius: 3, margin: "0 2px" }}>
                {picked !== null ? q.c[q.a] : "＿＿"}
              </span>
            )}
          </React.Fragment>
        ))}
      </p>
      <div style={{ display: "grid", gap: 10 }}>
        {q.c.map((choice, i) => {
          const isAnswer = picked !== null && i === q.a;
          const isWrongPick = picked === i && i !== q.a;
          return (
            <button key={i} onClick={() => pick(i)}
              style={{
                ...sx.choice,
                borderColor: isAnswer || isWrongPick ? C.red : C.line,
                borderWidth: isAnswer || isWrongPick ? 2 : 1,
                background: isAnswer ? "#FFF6F4" : C.card,
                cursor: picked === null ? "pointer" : "default",
              }}>
              <span style={{ fontFamily: "'Zilla Slab', serif", fontSize: 17 }}>{choice}</span>
              {(isAnswer && picked === i) && <Maru ok={true} />}
              {isWrongPick && <Maru ok={false} />}
              {(isAnswer && picked !== i) && <span style={{ color: C.red, fontSize: 13, fontWeight: 700 }}>正解</span>}
            </button>
          );
        })}
      </div>
      {picked !== null && (
        <div style={sx.redNote}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
            <p style={{ margin: 0, fontSize: 12, fontWeight: 700, color: C.red, letterSpacing: 1 }}>赤ペン解説</p>
            <SpeakBtn text={fillSentence(q)} />
          </div>
          <p style={{ margin: "6px 0 0", fontSize: 14, lineHeight: 1.7, color: C.ink }}>{q.e}</p>
        </div>
      )}
      {picked !== null && (
        <button style={sx.btnPrimary} onClick={next}>{idx + 1 >= total ? "結果を見る" : "次の問題へ"}</button>
      )}
    </div>
  );
}

/* ================= オフライン会話ドリル画面 ================= */
function ConvoDrill({ drill, onExit }) {
  const [srs, setSrs] = useState(null);
  const [session, setSession] = useState(null); // 今回の会話: [{id, ...turn}]
  const [turnIdx, setTurnIdx] = useState(0);
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState(0);
  const [log, setLog] = useState([]);
  const bottomRef = useRef(null);
  useEffect(() => { bottomRef.current?.scrollIntoView({ behavior: "smooth" }); }, [turnIdx, picked, log]);

  // 導入1 + 本題3 + 締め1 をSRSで選び、毎回違う会話を組み立てる(不変IDで記録)
  const buildSession = (state) => {
    const keys = drill.turns.map(qid);
    const idxState = {};
    drill.turns.forEach((_, i) => { if (state[keys[i]]) idxState[i] = state[keys[i]]; });
    const idsOf = (ph) => drill.turns.map((t, i) => (t.ph === ph ? i : -1)).filter((i) => i >= 0);
    const take = (ph, n) => pickSRS(idsOf(ph), idxState, n).picked;
    const ids = [...take("open", 1), ...take("mid", 4), ...take("close", 1)];
    setSession(ids.map((i) => ({ id: i, ...shuffleChoices(drill.turns[i]) })));
    setTurnIdx(0); setPicked(null); setScore(0); setLog([]);
  };

  useEffect(() => {
    (async () => {
      const s = await loadSRS(`convo:${drill.id}`);
      setSrs(s);
      buildSession(s);
    })();
  }, []);

  const restart = () => buildSession(srs);
  const resetAll = async () => {
    await clearSRS(`convo:${drill.id}`);
    const s = {};
    setSrs(s);
    buildSession(s);
  };

  if (!session) {
    return <div style={sx.card}><p style={{ color: C.sub, fontSize: 14 }}>会話を準備中…</p></div>;
  }

  // このシナリオの全ターンを消化済み(復習期限もまだ先)
  if (session.length === 0) {
    return (
      <div style={sx.card}>
        <p style={sx.eyebrow}>{drill.label}</p>
        <p style={{ fontSize: 14, lineHeight: 1.8, margin: "10px 0", color: C.ink }}>
          このシナリオの表現をすべて消化しました。復習期限が来るまでお待ちいただくか、他のシナリオをどうぞ。
        </p>
        <p style={{ fontSize: 13, color: C.sub, lineHeight: 1.7 }}>チャットで「会話シナリオを補充して」と頼めば新しい表現を追加できます。</p>
        <button style={sx.btnGhost} onClick={resetAll}>このシナリオの記録をリセット</button>
        <button style={sx.btnGhost} onClick={onExit}>他のシチュエーションへ</button>
      </div>
    );
  }

  const done = turnIdx >= session.length;
  const t = session[turnIdx];

  const pick = (i) => {
    if (picked !== null || done) return;
    setPicked(i);
    const correct = i === t.answer;
    if (correct) setScore((s) => s + 1);
    // 正解したターンは即引退し、忘れた頃に復習で戻る(不変IDで記録)
    const s = gradeSRS({ ...srs }, qid(drill.turns[t.id]), correct);
    setSrs(s);
    saveSRS(`convo:${drill.id}`, s);
  };
  const next = () => {
    setLog((l) => [...l, { partner: t.partner, jp: t.jp, chosen: t.choices[picked], ok: picked === t.answer, correct: t.choices[t.answer], explain: t.explain }]);
    setTurnIdx(turnIdx + 1);
    setPicked(null);
  };

  const partnerBubble = (text, jp) => (
    <div>
      <div style={{ display: "flex", alignItems: "flex-start", gap: 8, maxWidth: "92%" }}>
        <div style={{ padding: "10px 14px", borderRadius: 14, borderBottomLeftRadius: 4, fontSize: 15, lineHeight: 1.6, background: "#EFECE4", color: C.ink }}>{text}</div>
        <SpeakBtn text={text} />
      </div>
      {jp && <p style={{ margin: "4px 0 0", fontSize: 11.5, color: C.sub, maxWidth: "88%" }}>{jp}</p>}
    </div>
  );

  return (
    <div style={{ ...sx.card, display: "flex", flexDirection: "column", minHeight: "70vh" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
        <p style={{ ...sx.eyebrow, whiteSpace: "nowrap" }}>{drill.label} <span style={{ color: C.sub, fontWeight: 400 }}>/ ドリル</span></p>
        <div style={{ display: "flex", gap: 6 }}>
          <button style={{ ...sx.btnGhost, margin: 0, padding: "6px 10px", width: "auto", flexShrink: 0 }} aria-label="会話を組み直す"
            onClick={() => buildSession(srs)}>🔀</button>
          <button style={{ ...sx.btnGhost, margin: 0, padding: "6px 14px", width: "auto", flexShrink: 0 }} onClick={onExit}>戻る</button>
        </div>
      </div>
      <div style={{ flex: 1, overflowY: "auto", display: "flex", flexDirection: "column", gap: 14, paddingBottom: 8 }}>
        {log.map((e, i) => (
          <div key={i} style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {partnerBubble(e.partner, e.jp)}
            <div style={{ display: "flex", alignItems: "center", gap: 6, marginLeft: "auto", maxWidth: "88%" }}>
              <div style={{ padding: "10px 14px", borderRadius: 14, borderBottomRightRadius: 4, fontSize: 15, lineHeight: 1.6, background: C.ink, color: "#fff" }}>{e.chosen}</div>
              <span style={{ color: C.red, fontSize: 18, fontWeight: 700 }}>{e.ok ? "○" : "✗"}</span>
            </div>
            {!e.ok && (
              <p style={{ margin: 0, marginLeft: "auto", maxWidth: "88%", fontSize: 12.5, color: C.red, fontStyle: "italic" }}>✎ {e.correct}</p>
            )}
          </div>
        ))}
        {!done && (
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {partnerBubble(t.partner, t.jp)}
            <p style={{ margin: "2px 0 0", fontSize: 12, color: C.sub }}>あなたの返答を選んでください({turnIdx + 1} / {session.length}):</p>
            <div style={{ display: "grid", gap: 8 }}>
              {t.choices.map((c, i) => {
                const isA = picked !== null && i === t.answer;
                const isW = picked === i && i !== t.answer;
                return (
                  <button key={i} onClick={() => pick(i)}
                    style={{ ...sx.choice, padding: "10px 14px", borderColor: isA || isW ? C.red : C.line, borderWidth: isA || isW ? 2 : 1, background: isA ? "#FFF6F4" : C.card, cursor: picked === null ? "pointer" : "default" }}>
                    <span style={{ fontSize: 14.5 }}>{c}</span>
                    {isA && picked === i && <Maru ok={true} />}
                    {isW && <Maru ok={false} />}
                    {isA && picked !== i && <span style={{ color: C.red, fontSize: 12, fontWeight: 700, flexShrink: 0 }}>正解</span>}
                  </button>
                );
              })}
            </div>
            {picked !== null && (
              <div style={{ ...sx.redNote, marginTop: 4 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
                  <p style={{ margin: 0, fontSize: 12, fontWeight: 700, color: C.red, letterSpacing: 1 }}>赤ペン解説</p>
                  <SpeakBtn text={t.choices[t.answer]} />
                </div>
                <p style={{ margin: "6px 0 0", fontSize: 14, lineHeight: 1.7 }}>{t.explain}</p>
              </div>
            )}
            {picked !== null && (
              <button style={{ ...sx.btnPrimary, marginTop: 6 }} onClick={next}>
                {turnIdx + 1 >= session.length ? "結果を見る" : "会話を続ける"}
              </button>
            )}
          </div>
        )}
        {done && (
          <div style={{ textAlign: "center", padding: "10px 0" }}>
            <p style={sx.eyebrow}>会話終了!</p>
            <p style={{ fontFamily: "'Zilla Slab', serif", fontSize: 44, fontWeight: 700, margin: "8px 0", color: C.ink }}>
              {score} <span style={{ fontSize: 20, color: C.sub }}>/ {session.length}</span>
            </p>
            <button style={sx.btnPrimary} onClick={restart}>次の会話へ(新しい組み合わせ)</button>
            <button style={sx.btnGhost} onClick={onExit}>他のシチュエーションへ</button>
          </div>
        )}
        <div ref={bottomRef} />
      </div>
    </div>
  );
}


function Talk({ onBack }) {
  const [drill, setDrill] = useState(null);
  const [scenario, setScenario] = useState(null);
  const [level, setLevel] = useState(LEVELS[1]);
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [autoSpeak, setAutoSpeak] = useState(true);
  const [prep, setPrep] = useState(null); // 予習画面に表示中のシナリオ
  const [review, setReview] = useState(null); // 復習ノート(9個の表現リスト)
  const [targets, setTargets] = useState([]); // 今日の表現(同じ場面の3点セット)
  const [theme, setTheme] = useState(""); // 今日の場面テーマ

  // シナリオ選択 → 「同じ場面で使う3表現」のセットを1つ選んで予習画面へ
  const openPrep = (sc) => {
    const pool = TALK_TARGETS[sc.id] || [];
    const set = pool[Math.floor(Math.random() * pool.length)] || { theme: "", items: [] };
    setTheme(set.theme);
    setTargets(set.items.map((t) => ({ ...t, hit: false })));
    setPrep(sc);
    setError(null);
  };
  const [listening, setListening] = useState(false);
  const recRef = useRef(null);
  const bottomRef = useRef(null);

  useEffect(() => { bottomRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages, loading]);

  // 新しい相手の発言を自動で読み上げ(オフにも切替可)
  useEffect(() => {
    if (!autoSpeak || messages.length === 0) return;
    const last = messages[messages.length - 1];
    if (last.role === "partner") speak(last.text);
  }, [messages]);

  // 英語の音声入力: 認識結果は入力欄に入り、確認してから送信できる
  const toggleMic = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      setError("この環境では音声認識が使えません。代わりにキーボードのマイクキー(音声入力)を英語モードでお使いください。");
      return;
    }
    if (listening) { try { recRef.current?.stop(); } catch (e) {} return; }
    try {
      const rec = new SR();
      rec.lang = "en-US";
      rec.interimResults = true;
      rec.continuous = false;
      rec.onresult = (e) => {
        const t = Array.from(e.results).map((r) => r[0].transcript).join(" ").trim();
        setInput(t);
      };
      rec.onend = () => setListening(false);
      rec.onerror = (e) => {
        setListening(false);
        if (e.error === "not-allowed" || e.error === "service-not-allowed") {
          setError("この画面の実行環境がマイクを遮断しているため、🎤は使えません(Safariの設定では解決できません)。代わりに、入力欄をタップ→キーボードを英語(English)に切替→マイクキーで話してください。同じことができます。");
        }
      };
      recRef.current = rec;
      setListening(true);
      setError(null);
      rec.start();
    } catch (e) {
      setListening(false);
      setError("音声認識を開始できませんでした。キーボードのマイクキーをお試しください。");
    }
  };

  // 会話セッションの保存/復元: 誤って閉じても会話が失われないようにする
  const saveTalkSession = (sc, msgs) => {
    try {
      kvSet("sess:talk", JSON.stringify({ scId: sc.id, levelId: level.id, theme, targets, messages: msgs }));
    } catch (e) { /* 保存できなくても会話は継続 */ }
  };

  useEffect(() => {
    (async () => {
      try {
        const raw = await kvGet("sess:talk");
        if (!raw) return;
        const sess = JSON.parse(raw);
        const sc = SCENARIOS.find((s) => s.id === sess.scId);
        if (!sc || !Array.isArray(sess.messages) || sess.messages.length === 0) return;
        const lv = LEVELS.find((l) => l.id === sess.levelId);
        if (lv) setLevel(lv);
        setTheme(sess.theme || "");
        setTargets(Array.isArray(sess.targets) ? sess.targets : []);
        setMessages(sess.messages);
        setScenario(sc);
        setError("↩ 前回の会話を復元しました。そのまま続けられます。");
      } catch (e) { /* 壊れた保存データは無視 */ }
    })();
  }, []);

  const start = async (sc) => {
    setScenario(sc);
    setLoading(true);
    setError(null);
    try {
      const text = await callClaude(
        `You are an English conversation partner and coach for a Japanese learner. Scenario: ${sc.prompt}. Level: ${level.id} (easy=short simple sentences, mid=natural everyday speech, hard=native-level with idioms).
The learner has just studied these target expressions for one specific situation — "${theme}": ${targets.map((t) => t.en).join(" / ")}. CRITICAL: never use these expressions yourself — they are reserved for the learner. Your job is to set them up: say lines and create moments to which each target expression would be the learner's natural reply (e.g., if a target is a consolation phrase, have a mishap yourself so the learner can console you; if it's an offer to pay, let the bill arrive and hesitate over it). Build the whole conversation around that ONE situation. Do not scatter into unrelated situations.
Open the conversation naturally in English with 1-2 sentences that put us right in the middle of the scene (an action, a reaction or a situation — a question is optional, not required). Make the opening invite one of the target expressions if possible.
Respond ONLY with JSON, no markdown: {"reply":"your English opening line","reply_jp":"replyの自然な日本語訳"}`
      );
      const j = parseTalk(text);
      const first = [{ role: "partner", text: j.reply, jp: j.jp }];
      setMessages(first);
      saveTalkSession(sc, first);
    } catch (e) {
      setError(`接続に失敗しました:${e.message || e}。もう一度お試しください。`);
      setScenario(null);
    }
    setLoading(false);
  };

  const send = async () => {
    const msg = input.trim();
    if (!msg || loading) return;
    setInput("");
    // 「今日の表現」を使えたか判定して✓を付ける
    const low = msg.toLowerCase().replace(/[’]/g, "'");
    setTargets((prev) => prev.map((t) => (!t.hit && low.includes(t.key) ? { ...t, hit: true } : t)));
    const history = [...messages, { role: "me", text: msg }];
    setMessages(history);
    setLoading(true);
    setError(null);
    try {
      const hist = history.map((m) => `${m.role === "me" ? "Learner" : "You"}: ${m.text}`).join("\n");
      const text = await callClaude(
        `You are an English conversation partner and coach for a Japanese learner. Scenario: ${scenario.prompt}. Level: ${level.id} (easy=short simple sentences, mid=natural everyday speech, hard=native-level with idioms and slang where fitting).
Conversation so far:
${hist}

Target expressions for today's ONE situation ("${theme}"): ${targets.map((t) => (t.hit ? "[USED] " : "") + t.en).join(" / ")}. CRITICAL: never say these expressions yourself — they are reserved for the learner. Stay inside that situation and keep serving up moments where an unused target expression would be the learner's natural next reply (make the mishap, bring the bill, propose the toastable good news — whatever invites it). If the learner's latest message used one of them, praise it briefly in the feedback.

Task:
1. Reply naturally in English (1-3 sentences) as a real companion in this scene. Prefer reactions, comments and statements that move the situation forward. Do NOT ask a question in every message — ask at most one question every 3-4 turns, only when it feels natural.
2. Give brief feedback IN JAPANESE on the learner's latest message: point out errors in prepositions, articles (a/the), word choice or naturalness, and explain why in one or two short sentences. If it was perfect, praise briefly and mention one nuance.
3. If there is a more natural way to say it, provide the improved English sentence; otherwise null.
4. Provide a natural Japanese translation of your English reply.

Respond ONLY with JSON, no markdown:
{"reply":"...","reply_jp":"replyの自然な日本語訳","feedback":"日本語のフィードバック","better":"improved sentence or null"}`
      );
      const j = parseTalk(text);
      const updated = history.map((m, i) => (i === history.length - 1 ? { ...m, feedback: j.feedback, better: j.better } : m));
      const finalMsgs = [...updated, { role: "partner", text: j.reply, jp: j.jp }];
      setMessages(finalMsgs);
      // 会話を1往復ごとに保存: スクロール等で閉じても次回復元できる
      saveTalkSession(scenario, finalMsgs);
    } catch (e) {
      // 失敗しても打った英文が消えないよう入力欄に戻す
      setInput(msg);
      setMessages((prev) => prev.filter((m, i) => !(i === prev.length - 1 && m.role === "me" && m.text === msg)));
      setError(`返答の取得に失敗しました:${e.message || e}。そのまま「送信」でもう一度お試しください。`);
    }
    setLoading(false);
  };

  if (drill) {
    return <ConvoDrill drill={drill} onExit={() => setDrill(null)} />;
  }

  if (!scenario) {
    return (
      <div style={sx.card}>
        <p style={sx.eyebrow}>会話ドリル(オフライン・すぐ遊べる)</p>
        <p style={{ fontSize: 13, color: C.sub, margin: "4px 0 12px" }}>相手のセリフに対して最適な返答を選ぶ、接続不要のドリルです。</p>
        <div style={{ display: "grid", gap: 10, marginBottom: 22 }}>
          {CONVO_DRILLS.map((d) => (
            <button key={d.id} onClick={() => setDrill(d)} style={{ ...sx.choice, cursor: "pointer" }}>
              <span>
                <span style={{ fontWeight: 700, fontSize: 15 }}>{d.label}</span>
                <span style={{ display: "block", fontSize: 12, color: C.sub, marginTop: 2 }}>{d.desc}</span>
              </span>
              <span style={{ color: C.red }}>→</span>
            </button>

        </div>

        <p style={sx.eyebrow}>AI会話(接続できる環境で)</p>
        <p style={{ fontSize: 13, color: C.sub, margin: "4px 0 12px" }}>AIパートナーとの自由会話は、Claude内で開いた場合のみ利用できます(この配布版では接続できません)。上のドリルと下の復習ノートはすべてご利用いただけます。</p>
        <button style={{ ...sx.choice, cursor: "pointer", width: "100%", marginBottom: 14 }} onClick={() => setReview(pickReview9())}>
          <span>
            <span style={{ fontWeight: 700, fontSize: 15 }}>📖 復習ノート</span>
            <span style={{ display: "block", fontSize: 12, color: C.sub, marginTop: 2 }}>学んだ「今日の表現」からランダムに9個を復習</span>
          </span>
          <span style={{ color: C.sub }}>→</span>
        </button>
        {review && (
          <div style={{ position: "fixed", inset: 0, background: "rgba(30,28,24,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50, padding: 16 }}
            onClick={() => setReview(null)}>

              <span style={{ color: C.sub }}>→</span>

              <p style={{ ...sx.eyebrow, marginBottom: 2 }}>今日の表現 <span style={{ color: C.sub, fontWeight: 400 }}>/ {prep.label}</span></p>
              <p style={{ fontSize: 17, fontWeight: 700, margin: "6px 0 4px", color: C.ink }}>場面:{theme}</p>

              {targets.map((t, i) => (
                <div key={i} style={{ border: `1.5px solid ${C.line}`, borderRadius: 12, padding: "12px 14px", marginBottom: 10, background: "#fff" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
                    <span style={{ fontWeight: 700, fontSize: 17, color: C.ink }}>{t.en}</span>
                    <SpeakBtn text={t.en} big />

                  <p style={{ margin: "6px 0 0", fontSize: 14, color: C.ink, opacity: 0.85 }}>{t.jp}</p>

            </span>

          {targets.every((t) => t.hit) && <span style={{ fontSize: 14, color: "#3D6B44", fontWeight: 700 }}>🎉 全部使えました!</span>}
        </div>

      <div style={{ flex: 1, overflowY: "auto", display: "flex", flexDirection: "column", gap: 12, paddingBottom: 8 }}>
        {messages.map((m, i) => (

              <div style={{

/* ================= スラング道場 ================= */
function Slang({ onBack }) {
  const [mode, setMode] = useState(null); // 'quiz' | 'ask'
  const [quiz, setQuiz] = useState(null);
  const [qIdx, setQIdx] = useState(0);
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState(0);
  const [done, setDone] = useState(false);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [askInput, setAskInput] = useState("");
  const [askLog, setAskLog] = useState([]);

  const [source, setSource] = useState("ai");
  const [slangIdxs, setSlangIdxs] = useState(null);
  const [slangSrs, setSlangSrs] = useState(null);
  const [misses, setMisses] = useState([]);

  // 忘却曲線クイズ: 内蔵問題からSRSで出題(正解→3日後に一度だけ復習→卒業)
  const startBankQuiz = async () => {
    setMode("quiz"); setLoading(true); setError(null);
    setQuiz(null); setQIdx(0); setPicked(null); setScore(0); setDone(false); setMisses([]);
    const s = await loadSRS("slang");
    const keys = SLANG_BANK.map(qid);
    const ids = SLANG_BANK.map((_, i) => i);
    const idxState = {};
    ids.forEach((i) => { if (s[keys[i]]) idxState[i] = s[keys[i]]; });
    const { picked: sel } = pickSRS(ids, idxState, 5);
    if (sel.length === 0) {
      setError("内蔵スラング問題をすべて消化しました!チャットで「スラングを補充して」と頼むと新しい問題を追加できます。");
      setMode(null);
    } else {
      setQuiz(sel.map((i) => shuffleChoices(SLANG_BANK[i])));
      setSlangIdxs(sel);
      setSlangSrs(s);
      setSource("builtin");
    }
    setLoading(false);
  };

  // AIおまかせクイズ: 毎回新規生成(学習記録の対象外)
  const startAiQuiz = async () => {
    setMode("quiz"); setLoading(true); setError(null);
    setQuiz(null); setQIdx(0); setPicked(null); setScore(0); setDone(false); setMisses([]);
    try {
      // 過去に出題された語を読み込み、AIに「これは避けろ」と指示する(毎回 ghosting 等が出るのを防ぐ)
      let seen = [];
      try {
        const raw = await kvGet("aiseen:slang");
        if (raw) seen = JSON.parse(raw) || [];
      } catch (e) { /* 記録が無ければ空から */ }
      // 内蔵100問+300問に既にある語も重複源なので、出題テーマを毎回変えて幅を出す
      const THEMES = [
        "workplace and business slang", "internet and texting abbreviations", "British slang and idioms",
        "sports and competition idioms", "money and shopping slang", "food and drink expressions",
        "emotions and reactions", "friendship and social life", "travel and daily errands",
        "technology and gaming slang", "weather and time idioms", "compliments and criticism",
      ];
      const theme = THEMES[Math.floor(Math.random() * THEMES.length)];
      const avoid = seen.slice(-60);
      const text = await callClaude(
        `Create 4 quiz questions about modern English slang and casual idioms for a Japanese intermediate learner.
Theme for this set: ${theme}. Choose LESS OBVIOUS, fresh expressions within that theme — avoid the most textbook-famous ones.
${avoid.length ? `NEVER use any of these already-quizzed expressions: ${avoid.join(", ")}.` : ""}
Also avoid these overused examples: ghosting, flex, salty, lit, savage, FOMO, ghost, tea, shade.
Mix meanings, usage situations, and "which is natural" questions. (seed: ${Date.now() % 100000})
Keep each explanation under 70 Japanese characters. Keep total output compact.
Respond ONLY with a JSON array, no markdown, no other text:
[{"question":"問題文(日本語でOK、スラングは英語のまま)","choices":["4つの選択肢"],"answer":0,"explanation":"日本語の短い解説(使う場面や注意点を一言)","term":"the slang expression itself in English"}]`
      );
      const arr = extractQuizArray(text);
      // 今回出た語を記録に追加(直近120語まで保持)
      const terms = arr.map((q) => (q.term || "").toLowerCase().trim()).filter(Boolean);
      if (terms.length) {
        const merged = [...seen, ...terms].filter((v, i, a) => a.indexOf(v) === i).slice(-120);
        kvSet("aiseen:slang", JSON.stringify(merged));
      }
      setQuiz(arr.map(shuffleChoices));
      setSource("ai");
    } catch (e) {
      setError(`AI生成に失敗しました(原因: ${e.message || e})。忘却曲線クイズをご利用ください。`);
      setMode(null);
    }
    setLoading(false);
  };

  const ask = async () => {
    const q = askInput.trim();
    if (!q || loading) return;
    setAskInput("");
    setAskLog((l) => [...l, { role: "me", text: q }]);
    setLoading(true); setError(null);
    try {
      const text = await callClaude(
        `You are a slang and casual English expert teaching a Japanese learner. Question: "${q}"
Answer concisely in Japanese: meaning, one example sentence in English with Japanese translation, and a note on politeness level / when NOT to use it. Keep it under 150 Japanese characters plus the example. Plain text only.`
      );
      setAskLog((l) => [...l, { role: "ai", text }]);
    } catch (e) {
      setError(`回答の取得に失敗しました:${e.message || e}`);
    }
    setLoading(false);
  };

  if (!mode) {
    return (
      <div style={sx.card}>
        <p style={sx.eyebrow}>スラング道場</p>
        <p style={{ fontSize: 14, color: C.sub, margin: "4px 0 16px" }}>教科書に載らない生きた英語を。クイズは毎回AIが新しい問題を出題します。</p>
        <div style={{ display: "grid", gap: 10 }}>
          <button style={{ ...sx.choice, cursor: "pointer" }} onClick={startBankQuiz}>
            <span><span style={{ fontWeight: 700 }}>忘却曲線クイズ</span><span style={{ display: "block", fontSize: 12, color: C.sub, marginTop: 2 }}>厳選100問から出題。正解→3日後に復習→卒業</span></span><span style={{ color: C.sub }}>→</span>
          </button>
          <button style={{ ...sx.choice, cursor: "pointer" }} onClick={startAiQuiz}>
            <span><span style={{ fontWeight: 700 }}>AIおまかせクイズ</span><span style={{ display: "block", fontSize: 12, color: C.sub, marginTop: 2 }}>AIが毎回新規生成(学習記録の対象外)</span></span><span style={{ color: C.sub }}>→</span>
          </button>
          <button style={{ ...sx.choice, cursor: "pointer" }} onClick={() => { setMode("ask"); setError(null); }}>
            <span><span style={{ fontWeight: 700 }}>スラング質問箱</span><span style={{ display: "block", fontSize: 12, color: C.sub, marginTop: 2 }}>「これどういう意味?」を即解説</span></span><span style={{ color: C.sub }}>→</span>
          </button>
        </div>
        {loading && <p style={{ color: C.sub, fontSize: 13, marginTop: 12 }}>問題を作成中…</p>}
        {error && <p style={{ color: C.red, fontSize: 13, marginTop: 12 }}>{error}</p>}
        <button style={sx.btnGhost} onClick={onBack}>メニューに戻る</button>
      </div>
    );
  }

  if (mode === "quiz") {
    if (loading && !quiz) return <div style={sx.card}><p style={{ color: C.sub }}>AIが問題を作成中…</p></div>;
    if (!quiz) return null;
    if (done) {
      return (
        <div style={sx.card}>
          <p style={sx.eyebrow}>スラングクイズ — 結果</p>
          <p style={{ fontFamily: "'Zilla Slab', serif", fontSize: 44, fontWeight: 700, margin: "8px 0", color: C.ink }}>{score} <span style={{ fontSize: 20, color: C.sub }}>/ {quiz.length}</span></p>
          {misses.length > 0 && (
            <div style={{ margin: "6px 0 12px", textAlign: "left" }}>
              <p style={{ margin: 0, fontSize: 12, fontWeight: 700, color: C.red, letterSpacing: 1 }}>赤ペン復習リスト({misses.length}問)</p>
              {misses.map((m, i) => (
                <div key={i} style={{ ...sx.redNote, marginTop: 10 }}>
                  <p style={{ margin: 0, fontSize: 14, fontWeight: 500, lineHeight: 1.6, color: C.ink }}>{m.q.question}</p>
                  <p style={{ margin: "6px 0 0", fontSize: 12.5, color: C.red }}>あなたの答え: {m.chosen} → 正解: {m.q.choices[m.q.answer]}</p>
                  <p style={{ margin: "6px 0 0", fontSize: 13, lineHeight: 1.7, color: C.ink }}>{m.q.explanation}</p>
                </div>
              ))}
            </div>
          )}
          <button style={sx.btnPrimary} onClick={() => (source === "ai" ? startAiQuiz() : startBankQuiz())}>次のセットへ</button>
          <button style={sx.btnGhost} onClick={() => setMode(null)}>戻る</button>
        </div>
      );
    }
    const q = quiz[qIdx];
    return (
      <div style={sx.card}>
        <div style={{ display: "flex", justifyContent: "space-between" }}>
          <p style={sx.eyebrow}>{source === "builtin" ? "忘却曲線クイズ" : "AIおまかせクイズ"}</p>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <p style={{ fontSize: 13, color: C.sub, margin: 0 }}>{qIdx + 1} / {quiz.length}</p>
            {source === "builtin" && (
              <button onClick={startBankQuiz} aria-label="セットを引き直す"
                style={{ background: "none", border: `1px solid ${C.line}`, borderRadius: 8, cursor: "pointer", fontSize: 13, padding: "2px 8px", color: C.ink }}>
                🔀
              </button>
            )}
          </div>
        </div>
        {error && <p style={{ fontSize: 11.5, color: C.sub, margin: "6px 0 0", lineHeight: 1.6 }}>{error}</p>}
        <p style={{ fontSize: 17, fontWeight: 500, lineHeight: 1.6, margin: "10px 0 16px", color: C.ink }}>{q.question}</p>
        <div style={{ display: "grid", gap: 10 }}>
          {q.choices.map((c, i) => {
            const isA = picked !== null && i === q.answer;
            const isW = picked === i && i !== q.answer;
            return (
              <button key={i} onClick={() => {
                if (picked !== null) return;
                setPicked(i);
                const correct = i === q.answer;
                if (correct) setScore((s) => s + 1);
                else setMisses((m) => [...m, { q, chosen: q.choices[i] }]);
                if (source === "builtin" && slangIdxs && slangSrs) {
                  const s = gradeSRS({ ...slangSrs }, qid(SLANG_BANK[slangIdxs[qIdx]]), correct);
                  setSlangSrs(s);
                  saveSRS("slang", s);
                }
              }}
                style={{ ...sx.choice, borderColor: isA || isW ? C.red : C.line, borderWidth: isA || isW ? 2 : 1, background: isA ? "#FFF6F4" : C.card, cursor: picked === null ? "pointer" : "default" }}>
                <span style={{ fontSize: 15 }}>{c}</span>
                {isA && picked === i && <Maru ok={true} />}
                {isW && <Maru ok={false} />}
                {isA && picked !== i && <span style={{ color: C.red, fontSize: 13, fontWeight: 700 }}>正解</span>}
              </button>
            );
          })}
        </div>
        {picked !== null && (
          <div style={sx.redNote}>
            <p style={{ margin: 0, fontSize: 12, fontWeight: 700, color: C.red, letterSpacing: 1 }}>赤ペン解説</p>
            <p style={{ margin: "6px 0 0", fontSize: 14, lineHeight: 1.7 }}>{q.explanation}</p>
          </div>
        )}
        {picked !== null && (
          <button style={sx.btnPrimary} onClick={() => {
            if (qIdx + 1 >= quiz.length) setDone(true);
            else { setQIdx(qIdx + 1); setPicked(null); }
          }}>
            {qIdx + 1 >= quiz.length ? "結果を見る" : "次の問題へ"}
          </button>
        )}
      </div>
    );
  }

  // ask mode
  return (
    <div style={{ ...sx.card, display: "flex", flexDirection: "column", minHeight: "60vh" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
        <p style={{ ...sx.eyebrow, whiteSpace: "nowrap" }}>スラング質問箱</p>
        <button style={{ ...sx.btnGhost, margin: 0, padding: "6px 14px", width: "auto", flexShrink: 0 }} onClick={() => { setMode(null); setError(null); }}>戻る</button>
      </div>
      <div style={{ flex: 1, overflowY: "auto", display: "flex", flexDirection: "column", gap: 12 }}>
        {askLog.length === 0 && (
          <p style={{ fontSize: 13, color: C.sub }}>例:「"no cap" ってどういう意味?」「"I'm down" は使っても失礼じゃない?」「映画で "sick!" と言ってたけど病気?」</p>
        )}
        {askLog.map((m, i) => (
          <div key={i} style={{
            maxWidth: "88%", padding: "10px 14px", borderRadius: 14, fontSize: 14, lineHeight: 1.7, whiteSpace: "pre-wrap",
            background: m.role === "me" ? C.ink : "#EFECE4", color: m.role === "me" ? "#fff" : C.ink,
            marginLeft: m.role === "me" ? "auto" : 0,
          }}>{m.text}</div>
        ))}
        {loading && <p style={{ color: C.sub, fontSize: 13 }}>調べています…</p>}
        {error && <p style={{ color: C.red, fontSize: 13 }}>{error}</p>}
      </div>
      <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
        <input value={askInput} onChange={(e) => setAskInput(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && ask()}
          placeholder="気になるスラングを質問…" style={sx.input} />
        <button onClick={ask} disabled={loading} style={{ ...sx.btnPrimary, margin: 0, width: "auto", flexShrink: 0, whiteSpace: "nowrap" }}>送信</button>
      </div>
    </div>
  );
}

const MENU = [
  { id: "prep", title: "前置詞ドリル", en: "Prepositions", desc: "in / on / at / to… 感覚で選べるように" },
  { id: "article", title: "冠詞ドリル", en: "a / an / the", desc: "日本人最大の弱点を徹底攻略" },
  { id: "talk", title: "会話練習", en: "Conversation", desc: "会議・ゴルフ・旅行・会食の実戦ドリル+AI会話" },
  { id: "slang", title: "スラング道場", en: "Slang Dojo", desc: "生きた英語をクイズと質問箱で" },
];

function App() {
  const [view, setView] = useState("home");
  const [health, setHealth] = useState(null); // 保存機能の自己診断結果
  const rootRef = useRef(null);

  /* スクロールの端に達した状態での「引っ張り」スワイプを無効化する。
     これが親画面(アーティファクト枠)に伝わると、アプリが閉じてしまうため。
     スクロール可能な場所では通常どおりスクロールできる。 */
  useEffect(() => {
    const root = rootRef.current;
    if (!root) return;
    let startY = 0;
    const onStart = (e) => {
      if (e.touches && e.touches.length) startY = e.touches[0].clientY;
    };
    // タッチ位置から遡って、その方向にまだスクロールできる要素があるか判定
    const canScroll = (node, dy) => {
      while (node && node instanceof Element) {
        const oy = getComputedStyle(node).overflowY;
        if ((oy === "auto" || oy === "scroll") && node.scrollHeight > node.clientHeight + 1) {
          if (dy > 0 && node.scrollTop > 0) return true; // 下に引っ張り=上へ戻れる余地あり
          if (dy < 0 && node.scrollTop + node.clientHeight < node.scrollHeight - 1) return true; // 上に引っ張り=下へ進める余地あり
        }
        if (node === root) break;
        node = node.parentElement;
      }
      return false;
    };
    const onMove = (e) => {
      if (!e.touches || !e.touches.length) return;
      const dy = e.touches[0].clientY - startY;
      if (!canScroll(e.target, dy)) e.preventDefault(); // 端での引っ張りだけを差し止める
    };
    document.addEventListener("touchstart", onStart, { passive: true });
    document.addEventListener("touchmove", onMove, { passive: false });
    return () => {
      document.removeEventListener("touchstart", onStart);
      document.removeEventListener("touchmove", onMove);
    };
  }, []);

  useEffect(() => {
    (async () => {
      // 使える保存方式を検出(標準→ブラウザ→内蔵DB→メモリ)
      const type = await ensureStorage();
      const grad = async (key) => {
        const s = await loadSRS(key);
        return Object.values(s).filter((r) => r && r.stage === 2).length;
      };
      const [p, a, sl] = await Promise.all([grad("prep"), grad("article"), grad("slang")]);
      setHealth({ type, p, a, sl });
    })();
  }, []);

  return (
    <div ref={rootRef} style={{ position: "fixed", inset: 0, overflowY: "auto", WebkitOverflowScrolling: "touch", overscrollBehavior: "none", touchAction: "pan-y", background: C.paper, fontFamily: "'Noto Sans JP', 'Hiragino Sans', sans-serif", color: C.ink }}>
      <style>{`@keyframes tblink { 0%, 80%, 100% { opacity: 0.25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }`}</style>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,500;0,700;1,500&family=Noto+Sans+JP:wght@400;500;700&display=swap');
        @keyframes drawMaru { to { stroke-dashoffset: 0; } }
        button:focus-visible, input:focus-visible { outline: 2px solid ${C.navy}; outline-offset: 2px; }
        @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
        input::placeholder { color: #9CA3AF; }
      `}</style>

      <div style={{ maxWidth: 560, margin: "0 auto", padding: "20px 16px 110px" }}>
        <header style={{ marginBottom: 20, cursor: "pointer" }} onClick={() => setView("home")}>
          <p style={{ margin: 0, fontSize: 11, letterSpacing: 3, color: C.red, fontWeight: 700 }}>AKAPEN ENGLISH</p>
          <h1 style={{ margin: "2px 0 0", fontFamily: "'Zilla Slab', serif", fontSize: 30, fontWeight: 700 }}>
            英語<span style={{ background: C.hi, padding: "0 6px", borderRadius: 3 }}>赤ペン</span>ノート
          </h1>
        </header>

        {view === "home" && (
          <div style={{ display: "grid", gap: 12 }}>
            <p style={{ fontSize: 14, color: C.sub, margin: "0 0 4px", lineHeight: 1.7 }}>
              前置詞・冠詞の精度を上げ、実戦の会話とスラングまで。間違いはすべて赤ペンで添削されます。
            </p>
            {health && (health.type !== "memory" ? (
              <p style={{ fontSize: 12, color: C.sub, margin: "0 0 4px", padding: "8px 12px", background: "#EFF3EC", borderRadius: 8 }}>
                学習記録: 保存OK({{ claude: "標準", local: "ブラウザ保存", idb: "内蔵DB" }[health.type]}・1問ごとに自動保存) ｜ 卒業 — 前置詞 {health.p}・冠詞 {health.a}・スラング {health.sl}
              </p>
            ) : (
              <p style={{ fontSize: 12, color: C.red, margin: "0 0 4px", padding: "8px 12px", background: "#FDF3F1", borderRadius: 8, lineHeight: 1.7 }}>
                ⚠ この環境ではどの保存方式も使えません。記録はこの起動中のみ有効です。
              </p>
            ))}
            {MENU.map((m) => (
              <button key={m.id} onClick={() => setView(m.id)}
                style={{ ...sx.choice, cursor: "pointer", padding: "16px 18px", alignItems: "center" }}>
                <span>
                  <span style={{ fontSize: 11, letterSpacing: 2, color: C.sub, fontFamily: "'Zilla Slab', serif" }}>{m.en.toUpperCase()}</span>
                  <span style={{ display: "block", fontSize: 17, fontWeight: 700, margin: "2px 0" }}>{m.title}</span>
                  <span style={{ display: "block", fontSize: 12.5, color: C.sub }}>{m.desc}</span>
                </span>
                <span style={{ color: C.red, fontSize: 20 }}>→</span>
              </button>
            ))}
          </div>
        )}

        {/* 全ビューを常時マウントし、非表示で状態を保持(タブ切替でも進行が消えない) */}
        <div style={{ display: view === "prep" ? "block" : "none" }}>
          <Quiz bank={PREP_BANK} bankId="prep" title="前置詞ドリル" onBack={() => setView("home")} />
        </div>
        <div style={{ display: view === "article" ? "block" : "none" }}>
          <Quiz bank={ART_BANK} bankId="article" title="冠詞ドリル" onBack={() => setView("home")} />
        </div>
        <div style={{ display: view === "talk" ? "block" : "none" }}>
          <Talk onBack={() => setView("home")} />
        </div>
        <div style={{ display: view === "slang" ? "block" : "none" }}>
          <Slang onBack={() => setView("home")} />
        </div>
      </div>

      {/* 下部タブバー */}
      <nav style={{
        position: "fixed", bottom: 0, left: 0, right: 0,
        background: C.card, borderTop: `1px solid ${C.line}`,
        display: "flex", justifyContent: "space-around",
        padding: "8px 4px calc(8px + env(safe-area-inset-bottom))",
        boxShadow: "0 -2px 8px rgba(35,43,56,0.06)", zIndex: 50,
      }}>
        {TABS.map((t) => {
          const active = view === t.id;
          return (
            <button key={t.id} onClick={() => setView(t.id)}
              style={{
                flex: 1, background: "none", border: "none", cursor: "pointer",
                fontFamily: "inherit", padding: "4px 2px",
                color: active ? C.red : C.sub,
                fontWeight: active ? 700 : 500,
              }}>
              <span style={{ display: "block", fontSize: 18, lineHeight: 1 }}>{t.icon}</span>
              <span style={{ display: "block", fontSize: 10.5, marginTop: 3, letterSpacing: 0.5 }}>{t.label}</span>
              <span style={{
                display: "block", height: 3, width: 24, margin: "4px auto 0", borderRadius: 2,
                background: active ? C.red : "transparent", transition: "background 0.15s",
              }} />
            </button>
          );
        })}
      </nav>
    </div>
  );
}

const TABS = [
  { id: "home", label: "ホーム", icon: "⌂" },
  { id: "prep", label: "前置詞", icon: "in" },
  { id: "article", label: "冠詞", icon: "the" },
  { id: "talk", label: "会話", icon: "💬" },
  { id: "slang", label: "スラング", icon: "🔥" },
];

/* ================= スタイル ================= */
const sx = {
  card: {
    background: C.card, border: `1px solid ${C.line}`, borderRadius: 16,
    padding: "20px 18px", boxShadow: "0 1px 3px rgba(35,43,56,0.06)",
  },
  eyebrow: { margin: 0, fontSize: 13, fontWeight: 700, letterSpacing: 1, color: C.ink },
  choice: {
    display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10,
    width: "100%", textAlign: "left", padding: "12px 16px",
    background: C.card, border: `1px solid ${C.line}`, borderRadius: 12,
    color: C.ink, fontFamily: "inherit", transition: "border-color 0.15s",
  },
  chip: {
    flex: 1, padding: "8px 6px", border: `1px solid ${C.line}`, borderRadius: 10,
    fontSize: 13, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", textAlign: "center",
  },
  redNote: {
    marginTop: 16, padding: "12px 14px", borderLeft: `3px solid ${C.red}`,
    background: "#FDF3F1", borderRadius: "0 10px 10px 0",
  },
  btnPrimary: {
    marginTop: 18, width: "100%", padding: "13px 18px", background: C.ink, color: "#fff",
    border: "none", borderRadius: 12, fontSize: 15, fontWeight: 700, cursor: "pointer", fontFamily: "inherit",
  },
  btnGhost: {
    marginTop: 10, width: "100%", padding: "11px 18px", background: "transparent", color: C.sub,
    border: `1px solid ${C.line}`, borderRadius: 12, fontSize: 14, cursor: "pointer", fontFamily: "inherit",
  },
  input: {
    flex: 1, padding: "12px 14px", border: `1px solid ${C.line}`, borderRadius: 12,
    fontSize: 15, fontFamily: "inherit", background: C.paper, color: C.ink, minWidth: 0,
  },
};


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
